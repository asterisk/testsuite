[globals]
SECRET=leaked

[default]

; The member's channel runs in [queue_members]. A short 'b' location must
; still be found here, in the caller's context.
exten => short,1,NoOp()
	same => n,Queue(test_queue,b(predial_handler^1),,,5)
	same => n,Hangup()

exten => short_args,1,NoOp()
	same => n,Queue(test_queue,b(predial_handler^1(short_args)),,,5)
	same => n,Hangup()

; Fully qualified locations work as before.
exten => full,1,NoOp()
	same => n,Queue(test_queue,b(default^predial_handler^1(full)),,,5)
	same => n,Hangup()

exten => full_member,1,NoOp()
	same => n,Queue(test_queue,b(queue_members^member_handler^1(full_member)),,,5)
	same => n,Hangup()

; 'B' runs on the caller's channel and is unaffected.
exten => caller_b,1,NoOp()
	same => n,Queue(test_queue,B(predial_handler^1(caller_b)),,,5)
	same => n,Hangup()

; The label exists in both contexts. The caller's must win.
exten => shadow,1,NoOp()
	same => n,Queue(test_queue,b(shadow_handler^1),,,5)
	same => n,Hangup()

; UNTRUSTED holds the literal text ${SECRET}. It must not be evaluated.
exten => noeval,1,NoOp()
	same => n,Set(UNTRUSTED=${BASE64_DECODE(JHtTRUNSRVR9)})
	same => n,Queue(test_queue,b(noeval_handler^1(${UNTRUSTED})),,,5)
	same => n,Hangup()

exten => predial_handler,1,NoOp()
	same => n,UserEvent(PredialHandler,Form: ${IF($[${LEN(${ARG1})}]?${ARG1}:short)})
	same => n,Return()

exten => shadow_handler,1,NoOp()
	same => n,UserEvent(PredialHandler,Form: shadow_caller)
	same => n,Return()

exten => noeval_handler,1,NoOp()
	same => n,UserEvent(PredialHandler,Form: noeval,Arg: ${ARG1})
	same => n,Return()

[queue_members]

exten => member,1,NoOp()
	same => n,Answer()
	same => n,Wait(1)
	same => n,Hangup()

exten => member_handler,1,NoOp()
	same => n,UserEvent(PredialHandler,Form: ${ARG1})
	same => n,Return()

exten => shadow_handler,1,NoOp()
	same => n,UserEvent(PredialHandler,Form: shadow_member)
	same => n,Return()
