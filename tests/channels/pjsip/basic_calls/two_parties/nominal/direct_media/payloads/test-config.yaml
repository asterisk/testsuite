testinfo:
    summary: 'Test payload mappings and attributes in direct-media reINVITEs'
    description: |
        This test gives two PJSIP endpoints different dynamic payload mappings
        and Opus and RFC4733 attributes. It verifies that the direct-media
        reINVITE to each endpoint uses the same compatible payload mappings and
        negotiated attributes.

properties:
    dependencies:
        - python: 'twisted'
        - python: 'starpy'
        - asterisk: 'res_pjsip'
        - asterisk: 'res_format_attr_opus'
        - asterisk: 'app_dial'
        - app: 'sipp'
    tags:
        - pjsip

test-modules:
    add-test-to-search-path: 'True'
    test-object:
        config-section: test-case-config
        typename: 'sipp.SIPpTestCase'

test-case-config:
    memcheck-delay-stop: 7
    reactor-timeout: 15
    connect-ami: 'True'
    fail-on-any: True
    test-iterations:
        -
            scenarios:
                - { 'key-args': {'scenario': 'bob.xml', '-p': '5060', '-i': '127.0.0.3', '-s': 'alice', '-timeout': '20s', '-mi': '127.0.0.3'},
                    'ordered-args': ['-timeout_error', '-key', 'custom_media_port', '6004'] }
                - { 'key-args': {'scenario': 'alice.xml', '-p': '5060', '-i': '127.0.0.2', '-s': 'bob', '-timeout': '20s', '-mi': '127.0.0.2'},
                    'ordered-args': ['-timeout_error', '-key', 'custom_media_port', '6004'] }
