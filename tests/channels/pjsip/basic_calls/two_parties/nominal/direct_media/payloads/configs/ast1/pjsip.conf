[system]
type=system
timer_t1=100
timer_b=6400

[global]
type=global
debug=yes

[local-transport]
type=transport
bind=127.0.0.1
protocol=udp

[endpoint](!)
type=endpoint
allow=!all,opus,ulaw
context=default
direct_media=yes
dtmf_mode=rfc4733
media_address=127.0.0.1

[alice](endpoint)
aors=alice

[alice]
type=aor
max_contacts=1
contact=sip:alice@127.0.0.2:5060\;transport=udp

[bob](endpoint)
aors=bob

[bob]
type=aor
max_contacts=1
contact=sip:bob@127.0.0.3:5060\;transport=udp
