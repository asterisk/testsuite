[local]
type=transport
protocol=udp
bind=127.0.0.1

[user1]
type=aor
max_contacts=1
contact=sip:static1@127.0.0.1:5062
contact=sip:static2@127.0.0.1:5063

[user1]
type=endpoint
transport=local
aors=user1
disallow=all
allow=ulaw

; Sharing an AOR must not duplicate its contacts in the response.
[shared]
type=endpoint
transport=local
aors=user1
disallow=all
allow=ulaw

; A contact must also be listed without an endpoint referencing its AOR.
[unreferenced]
type=aor
contact=sip:static3@127.0.0.1:5064
