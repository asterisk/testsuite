[system]
type=system
timer_t1=100
timer_b=6400

[transport-udp]
type=transport
bind=127.0.0.1:5060
protocol=udp

[transport-udp6]
type=transport
bind=[::1]:5060
protocol=udp

[transport-udp6-external]
type=transport
bind=[::]:5070
protocol=udp
external_media_address=2001:db8::99

[endpoint-template](!)
type=endpoint
context=default
allow=!all,ulaw

[follow-offer](endpoint-template)
rtp_ipv6=follow_offer

[rtp-ipv6-yes](endpoint-template)
rtp_ipv6=yes

[rtp-ipv6-no](endpoint-template)
rtp_ipv6=no

[follow-offer-media-address](endpoint-template)
rtp_ipv6=follow_offer
media_address=2001:db8::10

[follow-offer-external](endpoint-template)
rtp_ipv6=follow_offer
transport=transport-udp6-external

[follow-offer-bound](endpoint-template)
rtp_ipv6=follow_offer
transport=transport-udp6

[rtp-ipv6-yes-external](endpoint-template)
rtp_ipv6=yes
transport=transport-udp6-external
