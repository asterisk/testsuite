[system]
type=system
timer_t1=100
timer_b=6400

[global]
type=global
debug=yes

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[alice]
type=aor
contact=sip:127.0.0.1:5061

[alice]
type=identify
endpoint=alice
match=127.0.0.1

[alice]
type=endpoint
context=default
allow=ulaw
direct_media=no
ice_support=yes
ice_lite=yes
aors=alice
