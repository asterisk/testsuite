[global]
type=global

[system]
type=system
timer_t1=100
timer_b=6400

[transport-udp]
type=transport
protocol=udp
bind=127.0.0.1:5060

[srv-trunk-5xx]
type=endpoint
transport=transport-udp
aors=srv-trunk-5xx

[srv-trunk-5xx]
type=aor
contact=sip:qualify-5xx.example.com
qualify_frequency=300
qualify_timeout=2
qualify_2xx_only=yes

