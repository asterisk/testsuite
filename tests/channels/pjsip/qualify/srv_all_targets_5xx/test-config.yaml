testinfo:
    summary: 'Qualify remains reachable when one SRV target returns 5xx'
    description: |
        An AOR contact resolves to two SRV targets.  The preferred target
        returns 503 Service Unavailable and the secondary target returns
        200 OK.  qualify_2xx_only is enabled, so the 503 is a failed target.

        Both SIPp scenarios must receive OPTIONS and complete successfully,
        proving that every resolved target was queried.  The contact must be
        reported Reachable because at least one target returned 2xx.

test-modules:
    test-object:
        config-section: sipp-config
        typename: 'sipp.SIPpTestCase'
    modules:
        -
            config-section: dns-server-config
            typename: 'dns_server.DNSServer'
        -
            config-section: test-control
            typename: 'pluggable_modules.EventActionModule'

sipp-config:
    reactor-timeout: 15
    fail-on-any: True
    stop-after-scenarios: False
    test-iterations:
        -
            scenarios:
                - { 'key-args': {'scenario': 'options-503.xml',
                                 '-i': '127.0.0.1', '-p': '5061'} }
                - { 'key-args': {'scenario': 'options-200.xml',
                                 '-i': '127.0.0.1', '-p': '5062'} }

dns-server-config:
    port: 10053
    python-zones:
        -
            qualify-5xx.example.com

test-control:
    -
        # Wait until both targets are listening before initiating qualify.
        sipp-start:
            count: 2
        ami-actions:
            action:
                Action: 'PJSIPQualify'
                Endpoint: 'srv-trunk-5xx'
    -
        ami-events:
            conditions:
                match:
                    Event: 'ContactStatus'
                    ContactStatus: 'Reachable'
            requirements:
                match:
                    URI: 'sip:qualify-5xx.example.com'
            count: 1
        stop_test:

properties:
    dependencies:
        - buildoption: 'TEST_FRAMEWORK'
        - python: 'starpy'
        - sipp:
            version: 'v3.3'
        - asterisk: 'res_pjsip'
        - asterisk: 'res_resolver_unbound'
    tags:
        - pjsip
        - dns
        - qualify

