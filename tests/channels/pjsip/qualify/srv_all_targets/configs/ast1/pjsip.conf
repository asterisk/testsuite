[global]
type=global

[system]
type=system
timer_t1=100
timer_b=6400

[transport-udp]
type=transport
protocol=udp
bind=127.0.0.1:5060

[srv-trunk]
type=endpoint
transport=transport-udp
aors=srv-trunk

[srv-trunk]
type=aor
contact=sip:qualify.example.com
; Keep qualification enabled so its result is accepted.  This interval is
; longer than the test, so only the explicit AMI qualification runs.
qualify_frequency=300
qualify_timeout=2
