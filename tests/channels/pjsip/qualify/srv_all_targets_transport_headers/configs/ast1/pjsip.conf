[global]
type=global

[system]
type=system
timer_t1=100
timer_b=6400

[transport-tcp]
type=transport
protocol=tcp
bind=127.0.0.1:5060

[transport-flow]
type=transport
protocol=flow

[registration]
type=registration
transport=transport-flow
server_uri=sip:127.0.0.1:5070\;transport=tcp
client_uri=sip:test@qualify-headers.example.com
expiration=300
retry_interval=5
max_retries=1

[srv-trunk]
type=endpoint
transport=transport-flow
aors=srv-trunk

[srv-trunk]
type=aor
contact=sip:qualify-headers.example.com
qualify_frequency=300
qualify_timeout=2
