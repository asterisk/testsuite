[global]
type=global

[system]
type=system
timer_t1=100
timer_b=6400

[transport-udp-v4]
type=transport
protocol=udp
bind=127.0.0.1:5060

[transport-udp-v6]
type=transport
protocol=udp
bind=[::1]:5060

[transport-tcp-v4]
type=transport
protocol=tcp
bind=127.0.0.10:5060

[endpoint-template](!)
type=endpoint

[aor-template](!)
type=aor
qualify_frequency=300
qualify_timeout=2

[a-udp](endpoint-template)
transport=transport-udp-v4
aors=a-udp

[a-udp](aor-template)
contact=sip:a-udp.qualify-addresses.example.com:5061

[aaaa-udp](endpoint-template)
transport=transport-udp-v6
aors=aaaa-udp

[aaaa-udp](aor-template)
contact=sip:aaaa-udp.qualify-addresses.example.com:5063

[a-tcp](endpoint-template)
transport=transport-tcp-v4
aors=a-tcp

[a-tcp](aor-template)
contact=sip:a-tcp.qualify-addresses.example.com:5064\;transport=tcp

[a-tcp-selected](endpoint-template)
transport=transport-tcp-v4
aors=a-tcp-selected

[a-tcp-selected](aor-template)
contact=sip:a-tcp-selected.qualify-addresses.example.com
