[system]
type=system
timer_t1=100
timer_b=6400

; As in the nominal test the transports are bound to 127.0.0.2 while the
; peers are on 127.0.0.1, but the media source address is not pinned, so
; the kernel chooses it: by default on the UDP transport (alice, bob), and
; turned off explicitly on the TCP transport (gina).
[local-transport-udp]
type=transport
protocol=udp
bind=127.0.0.2:5060

[local-transport-tcp]
type=transport
protocol=tcp
bind=127.0.0.2:5060
pin_media_source=no

[alice]
type=endpoint
context=default
allow=!all,ulaw
direct_media=no
t38_udptl=yes

[bob]
type=endpoint
context=default
allow=!all,ulaw
direct_media=no
aors=bob

[bob]
type=aor
contact=sip:bob@127.0.0.1:5062

; gina calls in over TCP.
[gina]
type=endpoint
context=default
allow=!all,ulaw
direct_media=no
rewrite_contact=yes
