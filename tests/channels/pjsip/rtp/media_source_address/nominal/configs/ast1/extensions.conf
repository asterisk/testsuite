[default]
; alice: the fax receiver sends CED over RTP, then re-INVITEs to T.38 and
; sends T.38 indicators over UDPTL.
exten => fax,1,Answer()
 same => n,ReceiveFAX(${ASTDATADIR}/rx.tiff)
 same => n,Hangup()

; erin: a tone is played as early media, so that SourceCheck learns where to
; send erin's media, then the call goes to frank and media is relayed.
exten => frank,1,Progress()
 same => n,Playtones(440)
 same => n,Wait(1)
 same => n,StopPlaytones()
 same => n,Dial(PJSIP/frank)
 same => n,Hangup()

; bob, carol and dave: originated calls; gina: calls in over TCP. A tone is
; played for two seconds.
exten => tone,1,Answer()
 same => n,Set(TIMEOUT(absolute)=2)
 same => n,Milliwatt()
