[system]
type=system
timer_t1=100
timer_b=6400

; The transports are bound to 127.0.0.2 while the peers are on 127.0.0.1
; and 127.0.0.3, so the address SDP advertises differs from the source
; address the kernel would pick (127.0.0.1) for media sent from a
; wildcard-bound socket. Both send media from the address they are bound to.
[local-transport-udp]
type=transport
protocol=udp
bind=127.0.0.2:5060
pin_media_source=yes

[local-transport-tcp]
type=transport
protocol=tcp
bind=127.0.0.2:5060
pin_media_source=yes

[alice]
type=endpoint
context=default
allow=!all,ulaw
direct_media=no
t38_udptl=yes

[bob]
type=endpoint
context=default
allow=!all,ulaw
direct_media=no
aors=bob

[bob]
type=aor
contact=sip:bob@127.0.0.1:5062

; carol challenges the call, so Asterisk sends the INVITE again.
[carol]
type=endpoint
context=default
allow=!all,ulaw
direct_media=no
outbound_auth=carol
aors=carol

[carol]
type=auth
auth_type=userpass
username=carol
password=carol

[carol]
type=aor
contact=sip:carol@127.0.0.1:5063

; dave answers late, so Asterisk retransmits the INVITE.
[dave]
type=endpoint
context=default
allow=!all,ulaw
direct_media=no
aors=dave

[dave]
type=aor
contact=sip:dave@127.0.0.1:5064

; erin calls frank. Both allow direct media and reject the re-INVITEs that
; set it up, so Asterisk keeps relaying their media. They are on 127.0.0.3,
; for which the kernel would also choose 127.0.0.1 as the source address.
[erin]
type=endpoint
context=default
allow=!all,ulaw
direct_media=yes

[frank]
type=endpoint
context=default
allow=!all,ulaw
direct_media=yes
aors=frank

[frank]
type=aor
contact=sip:frank@127.0.0.3:5066

; gina calls in over TCP.
[gina]
type=endpoint
context=default
allow=!all,ulaw
direct_media=no
rewrite_contact=yes
