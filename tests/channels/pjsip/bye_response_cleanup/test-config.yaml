testinfo:
    summary: 'Release outgoing BYE sessions after final responses'
    description: |
        Originate one call per endpoint and hang it up in the dialplan.
        SIPp answers the outgoing BYEs with 200, 408, and 481. Each session
        must emit SESSION_DESTROYING while Asterisk is still running.
        SIPp must finish successfully before the test can pass. Destruction
        is allowed up to 5.5 seconds after each SIPp scenario finishes,
        including the normal UDP transaction cleanup for the 200 response.

test-modules:
    add-test-to-search-path: True
    test-object:
        config-section: sipp-config
        typename: 'sipp.SIPpTestCase'
    modules:
        -
            typename: 'session_cleanup.SessionCleanup'

sipp-config:
    connect-ami: True
    reactor-timeout: 15
    fail-on-any: True
    stop-after-scenarios: False
    test-iterations:
        -
            scenarios:
                - key-args:
                      scenario: 'bye-200.xml'
                      '-p': '5061'
                      '-s': 'bye-200'
                - key-args:
                      scenario: 'bye-408.xml'
                      '-p': '5062'
                      '-s': 'bye-408'
                - key-args:
                      scenario: 'bye-481.xml'
                      '-p': '5063'
                      '-s': 'bye-481'

properties:
    dependencies:
        - buildoption: 'TEST_FRAMEWORK'
        - python: 'twisted'
        - python: 'starpy'
        - app: 'sipp'
        - asterisk: 'chan_pjsip'
        - asterisk: 'res_pjsip'
        - asterisk: 'res_pjsip_session'
        - asterisk: 'res_pjsip_sdp_rtp'
        - asterisk: 'res_rtp_asterisk'
    tags:
        - pjsip
