[default]
exten => s,1,Answer()
	same => n,Dial(IAX2/to-hop1/s)
	same => n,Hangup()

[nothing]
exten => s,1,Answer()
	same => n,Wait(10)
	same => n,Hangup()

[from-hop1]
exten => s,1,NoOp()
	; this call should be using the lpc10 codec
	same => n,Dial(Local/s@local1/n)
	same => n,Hangup()

[local1]
exten => s,1,Progress()
	same => n,Dial(Local/s@target1/n,,G(split))
	same => n(split),Hangup()
	same => n(callee),NoOp()

	; the incoming call is LPC, we're still LPC now, and we need to make it ulaw or MF won't work
	; change it so that it's still LPC towards the incoming trunk but will be ulaw from here towards the outgoing trunk
	same => n,NoOp(${CHANNEL(audioreadformat)} / ${CHANNEL(audiowriteformat)} / ${CHANNEL(audionativeformat)})

	; we should be in lpc10 at this point
	same => n,GotoIf($["${CHANNEL(audionativeformat)}"="(lpc10)"]?fail,1)

	; If this line were commented out, this test should fail.
	; That scenario represents the "status quo", where we only convert from lpc10 to ulaw at the last possible moment.
	; For this test to pass, we have to explicitly make that conversion happen earlier so that the MF gets sent in ulaw, not lpc10.
	same => n,Set(CHANNEL(audionativeformat)=ulaw)

	same => n,NoOp(${CHANNEL(audioreadformat)} / ${CHANNEL(audiowriteformat)} / ${CHANNEL(audionativeformat)})

	; the receiver will only receive the MF if the audio is sent in ulaw, not in lpc10
	same => n,Wait(0.5)
	same => n,SendMF(*1234567890#,140,75,120,85)
	same => n,Wait(0.5)
	same => n,Hangup()
exten => fail,1,UserEvent(ReceiveMFSuccess,Result: Fail Channel was in ${CHANNEL(audionativeformat)} format)
	same => n,Hangup()

[target1]
exten => s,1,NoOp()
	; normally we'd be in lpc10 still at this point, but in this test, we should be in ulaw by now (if we're not, the test won't pass anyways):
	same => n,NoOp(${CHANNEL(audioreadformat)} / ${CHANNEL(audiowriteformat)} / ${CHANNEL(audionativeformat)})
	same => n,Dial(IAX2/to-outbound/s)
	same => n,Hangup()

[from-outbound]
exten => s,1,NoOp()
	same => n,Answer()
	same => n,ReceiveMF(digits,4,k) ; don't return * but do return #
	same => n,NoOp(${digits})
	same => n,ExecIf($["${digits}"="1234567890#"]?UserEvent(ReceiveMFSuccess,Result: Pass):UserEvent(ReceiveMFSuccess,Result: Fail ${RECEIVEMFSTATUS} ${digits},Reason: ${digits}))
	same => n,Hangup()
