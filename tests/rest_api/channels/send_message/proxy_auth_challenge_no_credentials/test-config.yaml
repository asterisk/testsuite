testinfo:
    summary: Verify sendMessage fails when challenged with 407 and no credentials configured
    description: |
        Start a live PJSIP dialog in Stasis, send ARI channel sendMessage,
        have the remote SIP endpoint challenge with 407 Proxy Authentication
        Required, and verify Asterisk reports a failed
        ChannelMessageDeliveryStatus event with sip_status_code=407 because
        no outbound_auth is configured on the endpoint.

test-modules:
    add-to-search-path:
        - 'tests/rest_api/channels/send_message'
    test-object:
        typename: ari.AriBaseTestObject
        config-section: test-object-config
    modules:
        -
            typename: send_message.SendMessageScenario
            config-section: scenario-config

test-object-config:
    config-path: 'tests/rest_api/channels/send_message/configs'
    stop-on-end: False

scenario-config:
    sipp:
        - { 'scenario': 'proxy_auth_no_creds.xml', '-p': '5061', '-timeout': '30s' }
    requests:
        -
            request_id: 'proxy-no-creds-challenge'
            params:
                content_type: 'text/plain'
                body: 'Challenge this proxy-style but no credentials available'
            expect: 202
            event:
                status: 'failed'
                sip_status_code: 407
                reason: 'Proxy Authentication Required'

properties:
    dependencies:
        - python : autobahn.websocket
        - python : requests
        - python : twisted
        - python : starpy
        - app : sipp
        - asterisk : res_http_websocket
        - asterisk : res_ari_events
        - asterisk : res_ari_applications
        - asterisk : res_ari_channels
        - asterisk : chan_pjsip
        - asterisk : res_pjsip
        - asterisk : res_pjsip_messaging
        - asterisk : app_stasis
    tags:
        - ARI
        - pjsip
