testinfo:
    summary: Verify sendMessage returns 422 for non-PJSIP Stasis channels
    description: |
        Create a Local channel that answers and enters Stasis, then attempt
        channel sendMessage against that live non-PJSIP channel and verify a
        501 response with no delivery event.

test-modules:
    add-to-search-path:
        - 'tests/rest_api/channels/send_message'
    test-object:
        typename: ari.AriBaseTestObject
        config-section: test-object-config
    modules:
        -
            typename: send_message.SendMessageScenario
            config-section: scenario-config

test-object-config:
    config-path: 'tests/rest_api/channels/send_message/configs'
    stop-on-end: False

scenario-config:
    originate:
        endpoint: 'Local/s@send-message-local'
        app: 'testsuite'
    requests:
        -
            request_id: 'non-pjsip'
            params:
                content_type: 'text/plain'
                body: 'This should fail with 422'
            expect: 422
            event-count: 0

properties:
    dependencies:
        - python : autobahn.websocket
        - python : requests
        - python : twisted
        - python : starpy
        - asterisk : res_http_websocket
        - asterisk : res_ari_events
        - asterisk : res_ari_applications
        - asterisk : res_ari_channels
        - asterisk : app_stasis
    tags:
        - ARI
