[transport-udp]
type=transport
protocol=udp
bind=127.0.0.1:5060

[alice-auth]
type=auth
auth_type=userpass
username=alice
password=testpassword

[alice]
type=endpoint
transport=transport-udp
context=default
disallow=all
allow=ulaw
direct_media=no
outbound_auth=alice-auth

[alice]
type=identify
endpoint=alice
match=127.0.0.1
