testinfo:
    summary: Verify two concurrent sendMessage requests both succeed
    description: |
        Start a live PJSIP dialog in Stasis and issue two sendMessage
        requests back to back without waiting.  Both are accepted (202)
        and both produce a terminal ChannelMessageDeliveryStatus event.
        This verifies that the CSeq-keyed delivery tracking correctly
        correlates concurrent in-dialog MESSAGE transactions.

test-modules:
    add-to-search-path:
        - 'tests/rest_api/channels/send_message'
    test-object:
        typename: ari.AriBaseTestObject
        config-section: test-object-config
    modules:
        -
            typename: send_message.SendMessageScenario
            config-section: scenario-config

test-object-config:
    config-path: 'tests/rest_api/channels/send_message/configs'
    stop-on-end: False

scenario-config:
    sipp:
        - { 'scenario': 'overlap_accept_both.xml', '-p': '5061', '-timeout': '30s' }
    send-mode: 'immediate'
    requests:
        -
            request_id: 'overlap-one'
            params:
                content_type: 'text/plain'
                body: 'First overlapping MESSAGE'
            expect: 202
            event:
                status: 'delivered'
                sip_status_code: 200
                reason: 'OK'
        -
            request_id: 'overlap-two'
            params:
                content_type: 'text/plain'
                body: 'Second overlapping MESSAGE'
            expect: 202
            event:
                status: 'delivered'
                sip_status_code: 200
                reason: 'OK'

properties:
    dependencies:
        - python : autobahn.websocket
        - python : requests
        - python : twisted
        - python : starpy
        - app : sipp
        - asterisk : res_http_websocket
        - asterisk : res_ari_events
        - asterisk : res_ari_applications
        - asterisk : res_ari_channels
        - asterisk : chan_pjsip
        - asterisk : res_pjsip
        - asterisk : res_pjsip_messaging
        - asterisk : app_stasis
    tags:
        - ARI
        - pjsip
