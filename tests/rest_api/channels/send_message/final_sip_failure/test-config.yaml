testinfo:
    summary: Verify sendMessage reports a final SIP failure
    description: |
        Start a live PJSIP dialog in Stasis, send ARI channel sendMessage,
        make the remote SIP endpoint reject the in-dialog MESSAGE, and verify
        one terminal ChannelMessageDeliveryStatus event with failed status.

test-modules:
    add-to-search-path:
        - 'tests/rest_api/channels/send_message'
    test-object:
        typename: ari.AriBaseTestObject
        config-section: test-object-config
    modules:
        -
            typename: send_message.SendMessageScenario
            config-section: scenario-config

test-object-config:
    config-path: 'tests/rest_api/channels/send_message/configs'
    stop-on-end: False

scenario-config:
    sipp:
        - { 'scenario': 'plain_text_reject.xml', '-p': '5061', '-timeout': '30s' }
    requests:
        -
            request_id: 'plain-text-failure'
            params:
                content_type: 'text/plain'
                body: 'Please reject this MESSAGE'
            expect: 202
            event:
                status: 'failed'
                sip_status_code: 403
                reason: 'Forbidden'

properties:
    dependencies:
        - python : autobahn.websocket
        - python : requests
        - python : twisted
        - python : starpy
        - app : sipp
        - asterisk : res_http_websocket
        - asterisk : res_ari_events
        - asterisk : res_ari_applications
        - asterisk : res_ari_channels
        - asterisk : chan_pjsip
        - asterisk : res_pjsip
        - asterisk : res_pjsip_messaging
        - asterisk : app_stasis
    tags:
        - ARI
        - pjsip
