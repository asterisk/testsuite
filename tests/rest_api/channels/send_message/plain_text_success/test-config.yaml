testinfo:
    summary: Verify a plain text channel sendMessage round trip
    description: |
        Start a live PJSIP dialog in Stasis, send plain text with ARI
        channel sendMessage, verify the remote SIP endpoint receives it,
        and verify one terminal ChannelMessageDeliveryStatus event.

test-modules:
    add-to-search-path:
        - 'tests/rest_api/channels/send_message'
    test-object:
        typename: ari.AriBaseTestObject
        config-section: test-object-config
    modules:
        -
            typename: send_message.SendMessageScenario
            config-section: scenario-config

test-object-config:
    config-path: 'tests/rest_api/channels/send_message/configs'
    stop-on-end: False

scenario-config:
    sipp:
        - { 'scenario': 'plain_text_accept.xml', '-p': '5061', '-timeout': '30s' }
    requests:
        -
            request_id: 'plain-text-success'
            params:
                content_type: 'text/plain'
                body: 'Hello from ARI plain text'
            expect: 202
            event:
                status: 'delivered'
                sip_status_code: 200
                reason: 'OK'

properties:
    dependencies:
        - python : autobahn.websocket
        - python : requests
        - python : twisted
        - python : starpy
        - app : sipp
        - asterisk : res_http_websocket
        - asterisk : res_ari_events
        - asterisk : res_ari_applications
        - asterisk : res_ari_channels
        - asterisk : chan_pjsip
        - asterisk : res_pjsip
        - asterisk : res_pjsip_messaging
        - asterisk : app_stasis
    tags:
        - ARI
        - pjsip
